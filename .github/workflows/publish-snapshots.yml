name: Publish snapshots

on:
  push:
    branches: [ dev ]

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # A release version on dev (for example while a release is prepared) skips publishing
      # instead of failing the job.
      - name: Check SNAPSHOT version
        id: version
        run: |
          if ./gradlew properties --no-daemon -q | grep -q 'version: .*-SNAPSHOT'; then
            echo "snapshot=true" >> "$GITHUB_OUTPUT"
          else
            echo "Not a SNAPSHOT version, skipping snapshot publishing."
            echo "snapshot=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Import GPG signing key
        if: steps.version.outputs.snapshot == 'true'
        run: |
          echo -e "${{ secrets.OSSRH_GPG_SECRET_KEY }}" | gpg --batch --import
          gpg --list-secret-keys --keyid-format LONG

      - name: Publish to Sonatype snapshots
        if: steps.version.outputs.snapshot == 'true'
        env:
          OSSRH_USER: ${{ secrets.OSSRH_USER_TOKEN_ID }}
          OSSRH_PASSWORD: ${{ secrets.OSSRH_USER_TOKEN_SECRET }}
        run: >-
          ./gradlew
          -Psigning.gnupg.keyName=${{ secrets.OSSRH_GPG_SECRET_KEY_NAME }}
          -Psigning.gnupg.executable=gpg
          -Psigning.gnupg.passphrase=${{ secrets.OSSRH_GPG_SECRET_KEY_PASSWORD }}
          publish
