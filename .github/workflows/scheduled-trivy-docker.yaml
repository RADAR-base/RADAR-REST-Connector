name: Trivy scheduled Docker base image scan

on:
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  REPOSITORY: ${{ github.repository }}
  IMAGES: >-
    [{
    'name': 'kafka-connect-fitbit-source',
    'build_file': 'kafka-connect-fitbit-source/Dockerfile',
    'authors': 'Pim van Nierop <pim@thehyve.nl>, Pauline Conde <pauline.conde@kcl.ac.uk>',
    'description': 'RADAR-base Fitbit connector application'
    },{
    'name': 'kafka-connect-oura-source',
    'build_file': 'kafka-connect-oura-source/Dockerfile',
    'authors': 'Pim van Nierop <pim@thehyve.nl>, Pauline Conde <pauline.conde@kcl.ac.uk>',
    'description': 'RADAR-base Oura connector application'
    }]

jobs:
  prepare-matrix:
    name: Prepare Matrix Output
    permissions: {}
    runs-on: ubuntu-latest
    outputs:
      images: ${{ steps.step1.outputs.matrix }}
    steps:
      - name: Create Matrix Variable
        id: step1
        run: echo "matrix=${{ env.IMAGES }}" >> $GITHUB_OUTPUT

  security:
    needs: prepare-matrix
    runs-on: ubuntu-latest
    strategy:
      matrix:
        image: ${{ fromJson(needs.prepare-matrix.outputs.images ) }}
    permissions:
      contents: read
      packages: write
      security-events: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Lowercase image name
        run: |
          echo "DOCKER_IMAGE=${REGISTRY}/${REPOSITORY,,}/${{ matrix.image.name }}" >>${GITHUB_ENV}

      - uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: v0.74.0
          cache: true

      # '--pkg-types os' only tests the base image, like Snyk's --exclude-app-vulns.
      # Code base vulnerabilities are tested in scheduled-trivy.yaml.
      - name: Run Trivy to check for vulnerabilities
        run: >-
          trivy image
          --scanners vuln
          --pkg-types os
          --ignorefile .trivyignore.yaml
          --format sarif
          --output trivy.sarif
          "${DOCKER_IMAGE}"

      # Detected vulnerabilities will appear on GitHub in Security -> Code scanning alerts
      - name: Upload result to GitHub Code Scanning
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: trivy.sarif
          category: trivy-image-${{ matrix.image.name }}
